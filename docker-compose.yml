version: '3.8'

services:
  vocarag-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - EMBEDDING_MODEL_NAME=paraphrase-multilingual-mpnet-base-v2
      - MSMARCO_ENABLED=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
